; The photographed ESP8266MOD board uses the NodeMCU 1.0 pin layout.
[platformio]
default_envs = nodemcuv2

[env]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
board_build.f_cpu = 160000000L
monitor_speed = 921600
upload_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

[env:nodemcuv2]
build_flags = ${env.build_flags} -DSENSOR_SAMPLE_RATE_HZ=1000

; Fallback for a bench test that cannot sustain 1 kHz. Output columns stay identical.
[env:nodemcuv2_500hz]
build_flags = ${env.build_flags} -DSENSOR_SAMPLE_RATE_HZ=500
