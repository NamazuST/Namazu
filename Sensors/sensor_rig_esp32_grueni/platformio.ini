[platformio]
default_envs = grueni_500hz

[env]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
upload_speed = 115200
build_flags = -Wall -Wextra
build_src_filter = +<main.cpp>

; Highest supported CSV rate on this board's USB-UART path. Qualify on hardware.
[env:grueni_500hz]
monitor_speed = 921600
build_flags = ${env.build_flags} -DRIG_RATE_HZ=500 -DRIG_BAUD=921600

; Full-range CSV headroom: native MPU6050 divider 2 gives exactly 1000/3 Hz.
[env:grueni_333hz]
monitor_speed = 921600
build_flags = ${env.build_flags} -DRIG_RATE_HZ=333 -DRIG_BAUD=921600

; Additional fallback if acquisition/wiring cannot keep up.
[env:grueni_250hz]
monitor_speed = 921600
build_flags = ${env.build_flags} -DRIG_RATE_HZ=250 -DRIG_BAUD=921600

; First-sensor acquisition check: same pins/rate/range, S1 data group only.
[env:grueni_s1_500hz]
monitor_speed = 921600
build_flags = ${env.build_flags} -DRIG_RATE_HZ=500 -DRIG_BAUD=921600 -DRIG_NUM_SENSORS=1

; Two-sensor bench rig: S1 AD0=G25, S2 AD0=G26; shared SDA=G32/SCL=G33.
[env:grueni_s2_500hz]
monitor_speed = 921600
build_flags = ${env.build_flags} -DRIG_RATE_HZ=500 -DRIG_BAUD=921600 -DRIG_NUM_SENSORS=2

; Wiring diagnostic ONLY: connect one sensor, AD0 on G25. No acquisition stream.
[env:grueni_s1_probe]
monitor_speed = 921600
build_src_filter = +<s1_probe.cpp>

; Continuous latest-register polling: separate from the FIFO profiles above.
[env:grueni_latest4_500hz]
monitor_speed = 921600
build_src_filter = +<latest.cpp>
build_flags = ${env.build_flags} -DRIG_NUM_SENSORS=4

[env:grueni_latest5_500hz]
monitor_speed = 921600
build_src_filter = +<latest.cpp>
build_flags = ${env.build_flags} -DRIG_NUM_SENSORS=5
