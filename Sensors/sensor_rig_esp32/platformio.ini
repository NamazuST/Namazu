; ESP32 firmware for the MPU6050 sensor rig.
;
; Open this folder directly in VS Code / PlatformIO, then build and upload
; to a classic ESP32 dev board such as ESP32-WROOM / NodeMCU-32S.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 1000000
upload_speed = 921600
